name: ci

# On pull requests: a PR from a fork is validated too, and with it the result of the merge. On
# push, only to main: a push to any other branch is already covered by its pull request, so
# restricting this avoids a duplicate run of the same commit.
on:
  push:
    branches: [main]
  pull_request:

# What the GitHub Pages deployment of the `deploy` job needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch: main is not cancelled halfway through a deployment, the rest are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The configuration comes from the .env, and without it the build stops on purpose. The
      # development values are enough here, so a PR from a fork validates without secrets.
      # `pnpm install` already runs `nuxt prepare`, which reads it: this goes first.
      - name: Set up the environment
        run: cp .env.example .env

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The lockfile is what is installed, so an advisory that gets in through it is checked
      # here. High and critical stop the build; the rest is reported without failing it.
      - name: Audit the dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Only main publishes, and only if the repository has Pages enabled: the GITHUB_TOKEN
      # cannot enable it, so without Pages these steps are skipped and the branch stays on
      # lint, typecheck, test and generate, all green.
      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/configure-pages@v5

      - name: Generate the static site
        run: pnpm run generate
        env:
          # The site hangs off /<repo>/ on GitHub Pages, not off the root of the domain.
          # When the previous step is skipped, `base_path` comes empty and the site is
          # generated against the root, which is what we want to check it without publishing.
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # The public URL, for the canonical and the og:url. It wins over the .env, which
          # dotenv does not use to overwrite what is already in the environment. Without Pages
          # enabled the previous step is skipped and `base_url` comes empty: the URL the site
          # will have once it is enabled is composed here.
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  # Only the main branch publishes, and only with Pages enabled: with no artifact to deploy
  # the job would fail, so it is skipped just like the Pages steps.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
