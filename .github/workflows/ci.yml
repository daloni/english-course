name: ci

on: push

# Lo que necesita el despliegue a GitHub Pages del job `deploy`.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate the static site
        run: pnpm run generate
        env:
          # El sitio cuelga de /<repo>/ en GitHub Pages, no de la raíz del dominio.
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  # Solo la rama principal publica; el resto se queda en lint, test y generate.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
