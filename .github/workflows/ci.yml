name: ci

# En cada push y en cada pull request: un PR desde un fork también se valida, y con él el
# resultado del merge.
on:
  push:
  pull_request:

# Lo que necesita el despliegue a GitHub Pages del job `deploy`.
permissions:
  contents: read
  pages: write
  id-token: write

# Una ejecución por rama: main no se cancela a mitad de despliegue, el resto sí.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Solo main publica, y solo si el repositorio tiene Pages activado: el
      # GITHUB_TOKEN no puede darlo de alta, así que sin Pages estos pasos se saltan
      # y la rama se queda en lint, typecheck, test y generate, en verde.
      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/configure-pages@v5

      - name: Generate the static site
        run: pnpm run generate
        env:
          # El sitio cuelga de /<repo>/ en GitHub Pages, no de la raíz del dominio.
          # Cuando el paso anterior se salta, `base_path` viene vacío y el sitio se
          # genera contra la raíz, que es lo que queremos para comprobarlo sin publicar.
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # La URL pública, para el canonical y el og:url. Sin Pages activado el paso anterior
          # se salta y `base_url` viene vacío: se compone la que tendrá el sitio al activarlo.
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  # Solo la rama principal publica, y solo con Pages activado: sin artefacto que
  # desplegar el job fallaría, así que se salta igual que los pasos de Pages.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
