name: ci

# On pull requests: a PR from a fork is validated too, and with it the result of the merge. On
# push, only to main: a push to any other branch is already covered by its pull request, so
# restricting this avoids a duplicate run of the same commit.
on:
  push:
    branches: [main]
  pull_request:

# One run per branch: main is not cancelled halfway through a deployment, the rest are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The configuration comes from the .env, and without it the build stops on purpose. The
      # development values are enough here, so a PR from a fork validates without secrets.
      # `pnpm install` already runs `nuxt prepare`, which reads it: this goes first.
      - name: Set up the environment
        run: cp .env.example .env

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The lockfile is what is installed, so an advisory that gets in through it is checked
      # here. High and critical stop the build; the rest is reported without failing it.
      - name: Audit the dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Generate the static site
        run: pnpm run generate
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_SITE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

  # Preparing the deployment needs Pages metadata. Keeping it in a main-only job means code
  # from pull requests still runs with contents read and no Pages or OIDC credentials.
  pages:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        run: cp .env.example .env

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Generate the static site
        run: pnpm run generate
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .output/public

  # Only the main branch publishes, and only with Pages enabled: with no artifact to deploy
  # the job would fail, so it is skipped just like the Pages steps.
  deploy:
    needs: pages
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
