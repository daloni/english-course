allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# @nuxt/ui still requires @nuxt/fonts ^0.14.0 -> fontless ^0.2.1 -> esbuild ^0.27.0.
# GHSA-g7r4-m6w7-qqqr is fixed in 0.28.1; use the 0.28.2 already used by Vite/Nitro.
# Owner: @daloni. Review by 2026-12-17; remove when the font tooling accepts patched esbuild.
overrides:
  esbuild@^0.27.0: ^0.28.2

# No patched picomatch release exists (latest: 4.0.7). Only repository-owned build/test
# globs reach these tooling dependencies; learner answers never become glob patterns.
# Owner: @daloni. Review by 2026-11-24; remove when all affected parent ranges accept fixes.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

# Exact releases reviewed for this update; keep the default release-age protection elsewhere.
minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.156'
  - '@iconify-json/simple-icons@1.2.103'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - marked@18.2.1
