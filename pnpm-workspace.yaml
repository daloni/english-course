allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# Two transitive dependencies carry advisories that `pnpm update` cannot resolve on its own,
# so they are pinned here and nowhere else. Both are build tooling: nothing of this reaches
# the generated site.
overrides:
  # postcss asks for nanoid ^3.3.16 and pnpm keeps resolving 3.3.16, which is the version
  # with the advisory. 3.3.18 is inside the range that postcss already declares.
  nanoid@3: ^3.3.18
  # fontless (@nuxt/fonts) asks for esbuild ^0.27.0 and the fix only exists from 0.28.1 on:
  # no version inside its range is patched. 0.28.2 is what the rest of the tree already
  # uses, so this deduplicates esbuild instead of adding another copy of it.
  esbuild@^0.27.0: ^0.28.2

# Temporary audit exceptions, one per advisory, so any new high or critical advisory still
# fails `pnpm audit --audit-level high` in CI. Both have no patched release on npm. Owner:
# @daloni. Review by 2026-11-04: drop each entry as soon as a fix ships (see the README).
auditConfig:
  ignoreGhsas:
    # node-forge, through listhen (nuxt dev server). Only the RSA PKCS#1 v1.5 signature
    # verification is affected; listhen uses forge to generate the self-signed certificate of
    # `nuxt dev --https`, and nothing verifies a signature. Not part of the generated site.
    - GHSA-86w9-cpqp-85rv
    # braces, through micromatch (nitropack's globby). A stack overflow on deeply nested brace
    # patterns; the patterns come from the repo's own build configuration, never from a
    # request or from user input, and the site is static. Not part of the generated site.
    - GHSA-vfj7-8cjw-p6xm
